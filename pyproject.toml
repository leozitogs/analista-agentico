[project]
name = "analista"
version = "0.1.0.dev0"
description = "Agente que responde perguntas de negócio em português com SQL somente leitura, com acerto medido contra gabarito (em construção)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25",
    "pydantic>=2.6",
]

[project.scripts]
analista = "analista.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analista"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_politica.py" = ["E501"]  # consultas SQL, uma por linha

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
